system:
  project_name: adaptive-multimodal-ewaste-sorting
  version: 1.0.0
  random_seed: 42
  device: cuda
conveyor:
  default_speed_mps: 2.5
  speed_range_mps:
  - 1.0
  - 4.0
  belt_width_mm: 1000.0
  inspection_length_mm: 1500.0
  sampling_rate_fps: 60
camera:
  rgb_resolution:
  - 1200
  - 1184
  spectral_resolution:
  - 600
  - 640
  input_tensor_shape:
  - 4
  - 640
  - 640
  fov_width_mm: 1000.0
  fov_length_mm: 1200.0
homography:
  scale_x_mm_per_px: 1.5625
  scale_y_mm_per_px: 1.5625
  origin_offset_x_mm: 0.0
  origin_offset_y_mm: 0.0
taxonomy:
  classes:
    0:
      name: Conveyor Background
      value_eur_per_kg: 0.0
      density_g_cm3: 0.0
      thickness_mm: 0.0
      priority: NONE
      regulatory_flag: BACKGROUND
      target_bin: NONE
    1:
      name: High-Grade PCB
      value_eur_per_kg: 30.0
      density_g_cm3: 2.2
      thickness_mm: 1.6
      priority: HIGH
      regulatory_flag: ANNEX_VII
      target_bin: BIN_PCB_RECOVERY
    2:
      name: IC Molds & Chips
      value_eur_per_kg: 115.0
      density_g_cm3: 1.9
      thickness_mm: 2.5
      priority: HIGH
      regulatory_flag: CRITICAL_RAW_MATERIALS
      target_bin: BIN_IC_RECOVERY
    3:
      name: Battery Pack Units
      value_eur_per_kg: 8.5
      density_g_cm3: 2.85
      thickness_mm: 8.0
      priority: CRITICAL_HAZARDOUS
      regulatory_flag: ANNEX_VII_EXPLOSIVE
      target_bin: BIN_BATTERY_ISOLATION
    4:
      name: BFR Polymers
      value_eur_per_kg: -0.12
      density_g_cm3: 1.22
      thickness_mm: 2.0
      priority: CRITICAL_HAZARDOUS
      regulatory_flag: ROHS_BFR_HAZARDOUS
      target_bin: BIN_BFR_DECONTAMINATION
    5:
      name: Metallic Heat Sinks
      value_eur_per_kg: 4.15
      density_g_cm3: 5.83
      thickness_mm: 15.0
      priority: MEDIUM
      regulatory_flag: SECONDARY_METAL
      target_bin: BIN_METALS_RECOVERY
    6:
      name: Copper Wire Harnesses
      value_eur_per_kg: 5.85
      density_g_cm3: 2.15
      thickness_mm: 5.0
      priority: MEDIUM
      regulatory_flag: ANNEX_VII_CABLE
      target_bin: BIN_COPPER_RECOVERY
  dataset_mappings:
    spectralwaste:
      0: 0
      1: 4
      2: 0
      3: 0
      4: 6
      5: 6
      6: 4
model:
  architecture: fpn_mit_b2
  backbone_pretrained: imagenet
  num_classes: 7
  in_channels: 4
  img_size: 512
  conf_threshold: 0.35
  iou_threshold: 0.5
  max_det: 100
  class_thresholds:
    1: 0.68
    2: 0.54
    3: 0.36
    4: 0.55
    5: 0.32
    6: 0.59
training:
  stage1_freeze_epochs: 10
  stage1_lr: 0.001
  stage2_unfreeze_epochs: 100
  stage2_lr_max: 0.0001
  stage2_lr_min: 1.0e-06
  batch_size: 8
  weight_decay: 0.0005
  loss_weights:
    lambda_box: 7.5
    lambda_dfl: 1.5
    lambda_cls: 0.5
    lambda_mask: 2.5
  augmentations:
    blur_prob: 0.5
    glare_prob: 0.4
    dust_prob: 0.3
    cutout_prob: 0.3
    angular_jitter_deg: 2.0
    max_cutout_ratio: 0.3
tracking:
  tracker_type: bytetrack
  track_thresh: 0.5
  track_buffer: 30
  match_thresh: 0.8
  min_box_area: 50
telemetry:
  window_seconds: 10
  cost_electricity_eur_kwh: 0.22
  conveyor_power_kw: 4.5
